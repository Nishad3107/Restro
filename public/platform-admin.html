<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Platform Admin | RestroFlow</title>
  <style>
    body{background:#f8f4eb;color:#17211b;font-family:Arial,sans-serif;margin:0;padding:32px}.card{background:#fffdf8;border:1px solid #ddd4c5;border-radius:16px;box-shadow:0 12px 35px #36291712;margin:auto;max-width:560px;padding:28px}h1{font-family:Georgia,serif}label{color:#68736b;display:grid;gap:6px;margin:14px 0}input,select{border:1px solid #d9d0c3;border-radius:8px;padding:11px}button{background:#d97732;border:0;border-radius:8px;color:#fff;font-weight:700;padding:12px 16px}button.secondary{background:transparent;border:1px solid #d97732;color:#d97732}.error{color:#b24f38;min-height:24px}.success{color:#36704d;min-height:24px}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <p>RESTROFLOW PLATFORM</p>
    <h1>Merchant profiles</h1>
    <section id="loginPanel">
      <p>Sign in with a platform administrator account.</p>
      <form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form>
    </section>
    <section id="profilePanel" hidden>
      <p id="signedInAs"></p>
      <form id="profileForm"><label>Firebase Auth user UID<input id="uid" required></label><label>Tenant ID<input id="tenantId" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></label><label>Role<select id="role"><option>owner</option><option>manager</option><option>staff</option><option>receptionist</option><option>kitchen</option><option>kitchen_staff</option><option>waiter</option></select></label><label>Display name<input id="displayName"></label><button type="submit">Create merchant profile</button> <button id="signOut" class="secondary" type="button">Sign out</button></form>
    </section>
    <p id="message" class="error" role="alert"></p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
  <script>
    const firebaseConfig={apiKey:'AIzaSyAEkWv-q6YdZ2PqVmJternGsb3esoPSRFk',authDomain:'restro-6bf9c.firebaseapp.com',projectId:'restro-6bf9c',storageBucket:'restro-6bf9c.firebasestorage.app',messagingSenderId:'985955315480',appId:'1:985955315480:web:0d5dc1567a89201a6cf86d'};
    firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const message=document.getElementById('message');
    const setMessage=(text,ok=false)=>{message.textContent=text;message.className=ok?'success':'error';};
    auth.onAuthStateChanged(user=>{document.getElementById('loginPanel').hidden=!!user;document.getElementById('profilePanel').hidden=!user;if(user)document.getElementById('signedInAs').textContent=`Signed in as ${user.email||user.uid}`;});
    document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();setMessage('Signing in…');try{await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value);setMessage('Signed in.',true)}catch(error){setMessage(error.message)}});
    document.getElementById('signOut').addEventListener('click',()=>auth.signOut());
    document.getElementById('profileForm').addEventListener('submit',async event=>{event.preventDefault();setMessage('Creating profile…');try{const result=await firebase.app().functions('asia-south1').httpsCallable('createMerchantProfile')({uid:document.getElementById('uid').value.trim(),tenantId:document.getElementById('tenantId').value.trim().toLowerCase(),role:document.getElementById('role').value,displayName:document.getElementById('displayName').value.trim()});setMessage(`Profile created for ${result.data.uid}.`,true)}catch(error){setMessage(error.message||'Unable to create profile.')}});
  </script>
</body>
</html>
<link rel="stylesheet" href="theme.css">
