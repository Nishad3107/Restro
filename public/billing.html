<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing | RestroFlow</title><style>body{background:#fbf7ef;color:#17211b;font-family:Arial,sans-serif;margin:0;padding:24px}.shell{max-width:1000px;margin:auto}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.card{background:#fffdf8;border:1px solid #ddd4c5;border-radius:16px;padding:20px}.btn{background:#d97732;border:0;border-radius:8px;color:#fff;cursor:pointer;font-weight:700;padding:10px 14px}.btn.secondary{background:transparent;border:1px solid #d97732;color:#d97732}input{border:1px solid #d9d0c3;border-radius:8px;padding:9px;width:70px}.error{color:#b24f38;min-height:22px}[hidden]{display:none!important}</style></head><body><main class="shell"><p>RESTROFLOW OPERATIONS</p><h1>Session billing</h1><p id="signedInAs"></p><a href="admin.html">← Dashboard</a><section id="loginPanel" class="card"><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Sign in</button></form><p id="message" class="error"></p></section><section id="app" hidden><div id="sessions" class="grid"></div></section></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script><script>
const firebaseConfig={apiKey:'AIzaSyAEkWv-q6YdZ2PqVmJternGsb3esoPSRFk',authDomain:'restro-6bf9c.firebaseapp.com',projectId:'restro-6bf9c',storageBucket:'restro-6bf9c.firebasestorage.app',messagingSenderId:'985955315480',appId:'1:985955315480:web:0d5dc1567a89201a6cf86d'};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),fn=()=>firebase.app().functions('asia-south1'),q=new URLSearchParams(location.search),tenantId=q.get('tenant')||'royal-rasoi',locationId=q.get('location')||'main';const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));loginForm.onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(error){message.textContent=error.message}};auth.onAuthStateChanged(async user=>{loginPanel.hidden=!!user;app.hidden=!user;if(!user)return;const p=(await db.collection('users').doc(user.uid).get()).data()||{};if(p.tenantId!==tenantId&&!['platform_admin'].includes(p.role)){message.textContent='Not authorized';await auth.signOut();return}signedInAs.textContent=`${user.email||user.uid} · ${tenantId}/${locationId}`;db.collection('tenants').doc(tenantId).collection('locations').doc(locationId).collection('diningSessions').where('status','==','ACTIVE').onSnapshot(s=>{sessions.innerHTML=s.docs.map(doc=>{const x=doc.data();return `<article class="card"><h2>Table ${esc(x.tableNumber||x.tableId)}</h2><p>Session ${esc(doc.id)}</p><p>Subtotal ₹${Number(x.subtotal||0).toFixed(2)} · Tax ₹${Number(x.tax||0).toFixed(2)}</p><label>Split parts <input id="split-${esc(doc.id)}" type="number" min="1" max="20" value="1"></label><label>Service charge <input id="fee-${esc(doc.id)}" type="number" min="0" value="0"></label><button class="btn" data-session="${esc(doc.id)}">Generate bill</button></article>`}).join('')||'<article class="card">No active sessions.</article>';sessions.querySelectorAll('[data-session]').forEach(button=>button.onclick=async()=>{try{const result=await fn().httpsCallable('createSessionBill')({tenantId,locationId,sessionId:button.dataset.session,splitCount:Number(document.getElementById(`split-${button.dataset.session}`).value),serviceCharge:Number(document.getElementById(`fee-${button.dataset.session}`).value)});alert(`Bill ${result.data.billId} generated. Total ₹${result.data.total}`)}catch(error){message.textContent=error.message}})},error=>message.textContent=error.message)});
</script></body></html>
