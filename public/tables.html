<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tables | RestroFlow</title><style>body{background:#fbf7ef;color:#17211b;font-family:Arial,sans-serif;margin:0;padding:24px}.shell{max-width:1100px;margin:auto}.top{align-items:center;display:flex;justify-content:space-between;gap:16px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:24px}.card{background:#fffdf8;border:1px solid #ddd4c5;border-radius:16px;padding:20px}.card img{display:block;height:180px;margin:14px auto;max-width:180px}.btn{background:#d97732;border:0;border-radius:8px;color:#fff;cursor:pointer;font-weight:700;padding:10px 14px}.btn.secondary{background:transparent;border:1px solid #d97732;color:#d97732}input,select{border:1px solid #d9d0c3;border-radius:8px;padding:10px;width:100%}label{color:#68736b;display:grid;gap:5px;margin:8px 0}.form{background:#fffdf8;border:1px solid #ddd4c5;border-radius:16px;padding:18px}.message{min-height:22px}.error{color:#b24f38}.ok{color:#36704d}[hidden]{display:none!important}</style></head>
<body><main class="shell"><div class="top"><div><p>RESTROFLOW OPERATIONS</p><h1>Table management</h1><p id="signedInAs"></p></div><div><a href="admin.html">Dashboard</a> <button id="signOut" class="btn secondary" type="button">Sign out</button></div></div>
<section id="loginPanel" class="form"><h2>Sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Sign in</button></form></section>
<section id="app" hidden><form id="tableForm" class="form"><h2>Add table</h2><label>Table ID<input id="tableId" pattern="[a-z0-9\-]+" placeholder="table-12" required></label><label>Table number/name<input id="tableNumber" placeholder="12" required></label><label>Capacity<input id="capacity" type="number" min="1" max="50" value="4" required></label><button class="btn">Add table</button><p id="message" class="message" role="alert"></p></form><div id="tables" class="grid"></div></section></main>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyAEkWv-q6YdZ2PqVmJternGsb3esoPSRFk',authDomain:'restro-6bf9c.firebaseapp.com',projectId:'restro-6bf9c',storageBucket:'restro-6bf9c.firebasestorage.app',messagingSenderId:'985955315480',appId:'1:985955315480:web:0d5dc1567a89201a6cf86d'};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),query=new URLSearchParams(location.search),tenantId=query.get('tenant')||'royal-rasoi',locationId=query.get('location')||'main';let message=document.getElementById('message');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tell=(v,ok=false)=>{message.textContent=v;message.className=`message ${ok?'ok':'error'}`};
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value);tell('Signed in',true)}catch(error){tell(error.message)}});document.getElementById('signOut').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{loginPanel.hidden=!!user;app.hidden=!user;if(!user)return;try{const profile=(await db.collection('users').doc(user.uid).get()).data()||{};if(profile.tenantId!==tenantId&&!['platform_admin'].includes(profile.role))throw new Error('This account is not assigned to this restaurant.');signedInAs.textContent=`${user.email||user.uid} · ${tenantId} / ${locationId}`;listenTables()}catch(error){tell(error.message);await auth.signOut()}});
function listenTables(){db.collection('tenants').doc(tenantId).collection('locations').doc(locationId).collection('tables').onSnapshot(snapshot=>{tables.innerHTML=snapshot.docs.map(doc=>{const t=doc.data();const qr=`${location.origin}/index.html?tenant=${encodeURIComponent(tenantId)}&location=${encodeURIComponent(locationId)}&table=${encodeURIComponent(doc.id)}`;return `<article class="card"><h2>Table ${esc(t.number||doc.id)}</h2><p>Capacity: ${Number(t.capacity||0)} · <strong>${esc(t.status||'AVAILABLE')}</strong></p><canvas id="qr-${esc(doc.id)}" hidden></canvas><img id="img-${esc(doc.id)}" alt="QR code for table ${esc(t.number||doc.id)}"><button class="btn secondary" data-download="${esc(doc.id)}">Download QR</button><select data-status="${esc(doc.id)}"><option ${t.status==='AVAILABLE'?'selected':''}>AVAILABLE</option><option ${t.status==='OCCUPIED'?'selected':''}>OCCUPIED</option><option ${t.status==='RESERVED'?'selected':''}>RESERVED</option></select></article>`}).join('')||'<div class="card">No tables yet.</div>';snapshot.docs.forEach(doc=>{const qr=`${location.origin}/index.html?tenant=${encodeURIComponent(tenantId)}&location=${encodeURIComponent(locationId)}&table=${encodeURIComponent(doc.id)}`;QRCode.toDataURL(qr,{width:360,margin:2}).then(url=>{const img=document.getElementById(`img-${doc.id}`);if(img)img.src=url})});tables.querySelectorAll('[data-download]').forEach(button=>button.onclick=()=>{const img=document.getElementById(`img-${button.dataset.download}`);const link=document.createElement('a');link.download=`table-${button.dataset.download}-qr.png`;link.href=img.src;link.click()});tables.querySelectorAll('[data-status]').forEach(select=>select.onchange=async()=>{try{await firebase.app().functions('asia-south1').httpsCallable('updateTable')({tenantId,locationId,tableId:select.dataset.status,status:select.value});tell('Table updated',true)}catch(error){tell(error.message)}})},error=>tell(error.message))}
document.getElementById('tableForm').addEventListener('submit',async e=>{e.preventDefault();try{await firebase.app().functions('asia-south1').httpsCallable('createTable')({tenantId,locationId,tableId:tableId.value.trim().toLowerCase(),number:tableNumber.value.trim(),capacity:Number(capacity.value)});e.target.reset();capacity.value=4;tell('Table created',true)}catch(error){tell(error.message)}});
</script></body></html>
