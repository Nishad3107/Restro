const firebaseConfig={apiKey:'AIzaSyAEkWv-q6YdZ2PqVmJternGsb3esoPSRFk',authDomain:'restro-6bf9c.firebaseapp.com',projectId:'restro-6bf9c',storageBucket:'restro-6bf9c.firebasestorage.app',messagingSenderId:'985955315480',appId:'1:985955315480:web:0d5dc1567a89201a6cf86d'};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),fn=()=>firebase.app().functions('asia-south1'),q=new URLSearchParams(location.search),tenantId=q.get('tenant')||'royal-rasoi',locationId=q.get('location')||'main';const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));loginForm.onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(error){message.textContent=error.message}};auth.onAuthStateChanged(async user=>{loginPanel.hidden=!!user;app.hidden=!user;if(!user)return;const p=(await db.collection('users').doc(user.uid).get()).data()||{};if(p.tenantId!==tenantId&&!['platform_admin'].includes(p.role)){message.textContent='Not authorized';await auth.signOut();return}signedInAs.textContent=`${user.email||user.uid} · ${tenantId}/${locationId}`;db.collection('tenants').doc(tenantId).collection('locations').doc(locationId).collection('tableRequests').onSnapshot(s=>{requests.innerHTML=s.docs.map(doc=>{const r=doc.data();return `<article class="card"><h2>${esc(r.type)}</h2><p>Table ${esc(r.tableNumber||r.tableId||'—')} · ${esc(r.status)}</p>${r.status!=='RESOLVED'?`<button class="btn" data-id="${esc(doc.id)}">${r.status==='REQUESTED'?'Acknowledge':'Resolve'}</button>`:''}</article>`}).join('')||'<article class="card">No requests.</article>';requests.querySelectorAll('[data-id]').forEach(button=>button.onclick=async()=>{const card=button.closest('.card');const status=card.textContent.includes('REQUESTED')?'ACKNOWLEDGED':'RESOLVED';try{await fn().httpsCallable('updateTableRequest')({tenantId,locationId,requestId:button.dataset.id,status})}catch(error){message.textContent=error.message}})},error=>message.textContent=error.message)});
