<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen | RestroFlow</title><style>body{background:#17211b;color:#fff;font-family:Arial,sans-serif;margin:0;padding:24px}.shell{max-width:1200px;margin:auto}.top{align-items:center;display:flex;justify-content:space-between}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:24px}.card{background:#26362d;border-radius:16px;padding:20px}.muted{color:#b8c4bb}.btn{background:#d97732;border:0;border-radius:8px;color:#fff;cursor:pointer;font-weight:700;padding:10px 14px}.form{background:#fff;color:#17211b;border-radius:16px;padding:20px;max-width:420px}input{border:1px solid #ccd6cd;border-radius:8px;display:block;padding:10px;width:100%;margin:6px 0 12px}.error{color:#ffb4a5;min-height:22px}[hidden]{display:none!important}</style></head><body><main class="shell"><div class="top"><div><p>KITCHEN DISPLAY</p><h1>Preparation queue</h1><p id="signedInAs" class="muted"></p></div><a href="admin.html" style="color:#f2b275">Dashboard</a></div><section id="loginPanel" class="form"><h2>Staff sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Sign in</button></form><p id="message" class="error"></p></section><section id="app" hidden><div id="orders" class="grid"></div></section></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script><script>
const firebaseConfig={apiKey:'AIzaSyAEkWv-q6YdZ2PqVmJternGsb3esoPSRFk',authDomain:'restro-6bf9c.firebaseapp.com',projectId:'restro-6bf9c',storageBucket:'restro-6bf9c.firebasestorage.app',messagingSenderId:'985955315480',appId:'1:985955315480:web:0d5dc1567a89201a6cf86d'};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),query=new URLSearchParams(location.search),tenantId=query.get('tenant')||'royal-rasoi',locationId=query.get('location')||'main';const msg=t=>message.textContent=t;const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));loginForm.onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(error){msg(error.message)}};auth.onAuthStateChanged(async user=>{loginPanel.hidden=!!user;app.hidden=!user;if(!user)return;const profile=(await db.collection('users').doc(user.uid).get()).data()||{};if(profile.tenantId!==tenantId&&!['platform_admin'].includes(profile.role)){msg('This account is not assigned to this restaurant.');await auth.signOut();return}signedInAs.textContent=`${user.email||user.uid} · ${tenantId} / ${locationId}`;db.collection('tenants').doc(tenantId).collection('locations').doc(locationId).collection('orders').onSnapshot(snapshot=>{const active=snapshot.docs.map(doc=>({id:doc.id,...doc.data()})).filter(order=>order.orderType==='DINE_IN'&&!['SERVED','PAID','COMPLETED','CANCELLED'].includes(order.status));orders.innerHTML=active.map(order=>{const next=order.status==='ORDER_PLACED'?'ORDER_ACCEPTED':order.status==='ORDER_ACCEPTED'?'PREPARING':order.status==='PREPARING'?'READY':order.status==='READY'?'SERVED':'';return `<article class="card"><p class="muted">${esc(order.id)} · Table ${esc(order.tableNumber||order.tableId||'—')}</p><h2>${esc(order.status)}</h2><ul>${(order.items||[]).map(item=>`<li>${Number(item.quantity||1)} × ${esc(item.name)}</li>`).join('')}</ul><p class="muted">${esc(order.user?.instructions||'No special instructions')}</p>${next?`<button class="btn" data-order="${esc(order.id)}" data-next="${next}">${next}</button>`:''}</article>`}).join('')||'<article class="card"><h2>No active kitchen orders</h2></article>';orders.querySelectorAll('[data-order]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{await firebase.app().functions('asia-south1').httpsCallable('updateOrderStatus')({tenantId,locationId,orderId:button.dataset.order,status:button.dataset.next})}catch(error){button.disabled=false;msg(error.message)}})},error=>msg(error.message))});
</script></body></html>
